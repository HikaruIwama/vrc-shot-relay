# This workflow is managed by gh actions-lock.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - run: gh extension install github/gh-actions-lock --pin v0.1.6
        env:
          GH_TOKEN: ${{ github.token }}
      - run: gh actions-lock --verify-local
      - uses: jdx/mise-action@v5.1.1
        with:
          version: 2026.10.8
          github_token: ${{ github.token }}
      - uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('Cargo.lock', 'mise.toml') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-cargo-
      - run: rustup component add rustfmt clippy
      - run: mise run fmt-check
      - run: mise run lint
      - run: mise run deny
      - run: mise run test
      - run: mise run build
