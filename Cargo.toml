[package]
name = "vrc-shot-relay"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "bmp", "gif", "webp", "tiff"] }
notify = "8.2.0"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "multipart", "rustls"] }
roxmltree = "0.21.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.152"
time = { version = "0.3.55", features = ["formatting", "local-offset"] }
toml = "1.1.8"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_System_Console", "Win32_System_Com"] }
